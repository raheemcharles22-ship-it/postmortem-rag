apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
spec:
  replicas: 1
  selector:
    matchLabels: { app: rag }
  template:
    metadata:
      labels: { app: rag }
    spec:
      containers:
        - name: app
          image: postmortem-rag:local
          imagePullPolicy: IfNotPresent   # <- REQUIRED for a locally-loaded image
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: app-secrets, key: db-password }
            - name: DATABASE_URL
              value: "postgres://postgres:postgres@postgres:5432/postmortem_rag?sslmode=disable"
              # ^ "postgres" here is the Service name above, NOT localhost
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef: { name: app-secrets, key: openai-key }
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: app
spec:
  selector: { app: rag }
  ports:
    - port: 8080
      targetPort: 8080